# Enable the global TCP BBR congestion‑control algorithm
net.ipv4.tcp_congestion_control=cubic

net.ipv6.conf.all.disable_ipv6=0
net.ipv6.conf.default.disable_ipv6=0
net.ipv6.conf.default.accept_ra=2
net.ipv6.conf.all.accept_ra=2
# Note: In router environments you usually don’t need to force net.core.default_qdisc=fq
# It’s recommended to keep the system default fq_codel or use an SQM (e.g., CAKE) queue discipline, which balances latency and loss resistance.
